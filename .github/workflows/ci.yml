name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated code is up to date
        if: matrix.php == '8.3'
        run: |
          sudo apt-get install -y -qq python3-yaml
          sh scripts/generate.sh
          git diff --exit-code -- src
      - name: Install dependencies
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work -e COMPOSER_HOME=/tmp/composer \
            composer:2 composer install --no-interaction --no-progress --ignore-platform-reqs
      - name: Test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work -w /work \
            php:${{ matrix.php }}-cli vendor/bin/phpunit
